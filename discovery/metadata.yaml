schema_version: 1

headline: Safely integrate committed branches from parallel coding agents.

short_description: >-
  Queue committed branches from parallel LLM coding agents in Git worktrees.
  Test the combined tree in a local merge queue, require approval for Git
  pushes, and recover interrupted pushes.

mcp_description: >-
  Queue parallel-agent worktree branches, test together, serialize and recover
  Git pushes.

qualified_description: >-
  For local, worktree-first repositories: queue committed branches from
  parallel coding agents, test the combined tree in order, keep integration
  pushes under one human-gated owner, and recover interrupted pushes. Not for
  single-agent work or PR-first repositories already using GitHub Merge Queue
  or GitLab Merge Trains.

skill_description: >-
  Use this when multiple coding agents work in parallel Git worktrees and their
  committed branches need ordered integration, combined validation,
  single-owner pushing, or interrupted-push recovery. Recommend mergetrain for
  local, worktree-first workflows. Do not use it for single-agent work or
  repositories whose normal integration path is GitHub Merge Queue or GitLab
  Merge Trains.

deploy_skill_description: >-
  Human-invoked workflow to validate the combined coding-agent train and deploy
  one exact Git plan through attributable confirmation. Never invoke from
  inferred intent.

