<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="svg-title svg-description"><title id="svg-title">Why check the combination?</title><desc id="svg-description">Four-panel illustrative explainer. Separate branches pass their unit tests. Their combination fails because Agent A changes DEFAULT_TIMEOUT from 30 to 10 while Agent B adds TIMEOUT_BUDGET equal to 30; the test expects equality. Git merges cleanly. The operator explicitly dismisses jobs 1 and 2 for this demo and retains jobs 3 and 4. Authorization is bound to the exact surviving plan. Configured checks rerun before push by default. An atomic push to the disposable local Git remote and verification complete the deployment.</desc><defs><linearGradient id="work-0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2d7f4"/><stop offset="1" stop-color="#b6a0d4"/></linearGradient><linearGradient id="work-1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dce8d7"/><stop offset="1" stop-color="#a7c1a5"/></linearGradient><linearGradient id="work-2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe4a6"/><stop offset="1" stop-color="#e6bf67"/></linearGradient><linearGradient id="work-3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d5e5ff"/><stop offset="1" stop-color="#83aceb"/></linearGradient></defs><rect width="1280" height="720" fill="#f7f7f5"/><g font-family="Arial, Helvetica, sans-serif"><text x="48" y="51" font-size="32" fill="#16191f" font-weight="700" >mergetrain</text><text x="237" y="50" font-size="23" fill="#586171" font-weight="400" >by Oddfini</text><text x="1228" y="50" font-size="25" fill="#16191f" font-weight="500" text-anchor="end">Local merge queue</text><text x="48" y="121" font-size="54" fill="#16191f" font-weight="700" >Why check the combination?</text><rect x="48" y="151" width="580" height="229" rx="14" fill="#ffffff" stroke="#dce0e5" /><rect x="652" y="151" width="580" height="229" rx="14" fill="#ffffff" stroke="#dce0e5" /><rect x="48" y="400" width="580" height="232" rx="14" fill="#ffffff" stroke="#dce0e5" /><rect x="652" y="400" width="580" height="232" rx="14" fill="#ffffff" stroke="#dce0e5" /><text x="72" y="177" font-size="23" fill="#586171" font-weight="400" >01 · Illustrative workflow</text><text x="676" y="177" font-size="23" fill="#586171" font-weight="400" >02 · One shared check</text><text x="72" y="226" font-size="48" fill="#16191f" font-weight="700" >Branches pass</text><text x="676" y="226" font-size="48" fill="#16191f" font-weight="700" >Combination fails</text><rect x="81" y="255" width="92" height="32" rx="7" fill="url(#work-0)" stroke="#06734b" stroke-width="2"/><line x1="91" y1="261" x2="163" y2="261" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" /><rect x="92" y="279" width="5" height="3" rx="1" fill="#16191f" stroke="none" fill-opacity="0.28"/><text x="127" y="318" font-size="23" fill="#06734b" font-weight="700" text-anchor="middle">#1 PASS</text><rect x="216" y="255" width="92" height="32" rx="7" fill="url(#work-1)" stroke="#06734b" stroke-width="2"/><line x1="226" y1="261" x2="298" y2="261" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" /><rect x="227" y="279" width="5" height="3" rx="1" fill="#16191f" stroke="none" fill-opacity="0.28"/><rect x="237" y="279" width="5" height="3" rx="1" fill="#16191f" stroke="none" fill-opacity="0.28"/><text x="262" y="318" font-size="23" fill="#06734b" font-weight="700" text-anchor="middle">#2 PASS</text><rect x="351" y="255" width="92" height="32" rx="7" fill="url(#work-2)" stroke="#06734b" stroke-width="2"/><line x1="361" y1="261" x2="433" y2="261" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" /><rect x="362" y="279" width="5" height="3" rx="1" fill="#16191f" stroke="none" fill-opacity="0.28"/><rect x="372" y="279" width="5" height="3" rx="1" fill="#16191f" stroke="none" fill-opacity="0.28"/><rect x="382" y="279" width="5" height="3" rx="1" fill="#16191f" stroke="none" fill-opacity="0.28"/><text x="397" y="318" font-size="23" fill="#06734b" font-weight="700" text-anchor="middle">#3 PASS</text><rect x="486" y="255" width="92" height="32" rx="7" fill="url(#work-3)" stroke="#06734b" stroke-width="2"/><line x1="496" y1="261" x2="568" y2="261" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" /><rect x="497" y="279" width="5" height="3" rx="1" fill="#16191f" stroke="none" fill-opacity="0.28"/><rect x="507" y="279" width="5" height="3" rx="1" fill="#16191f" stroke="none" fill-opacity="0.28"/><rect x="517" y="279" width="5" height="3" rx="1" fill="#16191f" stroke="none" fill-opacity="0.28"/><rect x="527" y="279" width="5" height="3" rx="1" fill="#16191f" stroke="none" fill-opacity="0.28"/><text x="532" y="318" font-size="23" fill="#06734b" font-weight="700" text-anchor="middle">#4 PASS</text><text x="72" y="359" font-size="24" fill="#586171" font-weight="400" >Four independent unit-test runs pass.</text><rect x="680" y="242" width="524" height="88" rx="10" fill="#fcfcfa" stroke="#b32640" /><rect x="701" y="255.5" width="78" height="27" rx="7" fill="url(#work-0)" stroke="#b32640" stroke-width="2"/><line x1="711" y1="261.5" x2="769" y2="261.5" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" /><rect x="712" y="274.5" width="5" height="3" rx="1" fill="#16191f" stroke="none" fill-opacity="0.28"/><rect x="833" y="255.5" width="78" height="27" rx="7" fill="url(#work-1)" stroke="#b32640" stroke-width="2"/><line x1="843" y1="261.5" x2="901" y2="261.5" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" /><rect x="844" y="274.5" width="5" height="3" rx="1" fill="#16191f" stroke="none" fill-opacity="0.28"/><rect x="854" y="274.5" width="5" height="3" rx="1" fill="#16191f" stroke="none" fill-opacity="0.28"/><rect x="965" y="255.5" width="78" height="27" rx="7" fill="url(#work-2)" stroke="#e6bf67" stroke-width="2"/><line x1="975" y1="261.5" x2="1033" y2="261.5" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" /><rect x="976" y="274.5" width="5" height="3" rx="1" fill="#16191f" stroke="none" fill-opacity="0.28"/><rect x="986" y="274.5" width="5" height="3" rx="1" fill="#16191f" stroke="none" fill-opacity="0.28"/><rect x="996" y="274.5" width="5" height="3" rx="1" fill="#16191f" stroke="none" fill-opacity="0.28"/><rect x="1097" y="255.5" width="78" height="27" rx="7" fill="url(#work-3)" stroke="#83aceb" stroke-width="2"/><line x1="1107" y1="261.5" x2="1165" y2="261.5" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" /><rect x="1108" y="274.5" width="5" height="3" rx="1" fill="#16191f" stroke="none" fill-opacity="0.28"/><rect x="1118" y="274.5" width="5" height="3" rx="1" fill="#16191f" stroke="none" fill-opacity="0.28"/><rect x="1128" y="274.5" width="5" height="3" rx="1" fill="#16191f" stroke="none" fill-opacity="0.28"/><rect x="1138" y="274.5" width="5" height="3" rx="1" fill="#16191f" stroke="none" fill-opacity="0.28"/><line x1="707" y1="296" x2="905" y2="296" stroke="#b32640" stroke-width="2" stroke-linecap="round" /><line x1="707" y1="288" x2="707" y2="296" stroke="#b32640" stroke-width="2" stroke-linecap="round" /><line x1="905" y1="288" x2="905" y2="296" stroke="#b32640" stroke-width="2" stroke-linecap="round" /><text x="698" y="321" font-size="23" fill="#b32640" font-weight="500" >#1 + #2 · test expects equality</text><text x="676" y="359" font-size="24" fill="#586171" font-weight="400" >10 ≠ 30 · Git still merges cleanly.</text><text x="72" y="426" font-size="23" fill="#905600" font-weight="400" >03 · Explicit operator action</text><text x="676" y="426" font-size="23" fill="#586171" font-weight="400" >04 · Disposable local Git remote</text><text x="72" y="475" font-size="48" fill="#16191f" font-weight="700" >Operator decides</text><text x="676" y="475" font-size="48" fill="#16191f" font-weight="700" >Survivors land</text><rect x="72" y="491" width="244" height="55" rx="9" fill="#fff5e5" stroke="#ead7b8" /><rect x="87" y="504" width="84" height="28" rx="7" fill="url(#work-0)" stroke="#905600" stroke-width="2"/><line x1="97" y1="510" x2="161" y2="510" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" /><rect x="98" y="524" width="5" height="3" rx="1" fill="#16191f" stroke="none" fill-opacity="0.28"/><rect x="215" y="504" width="84" height="28" rx="7" fill="url(#work-1)" stroke="#905600" stroke-width="2"/><line x1="225" y1="510" x2="289" y2="510" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" /><rect x="226" y="524" width="5" height="3" rx="1" fill="#16191f" stroke="none" fill-opacity="0.28"/><rect x="236" y="524" width="5" height="3" rx="1" fill="#16191f" stroke="none" fill-opacity="0.28"/><line x1="331" y1="518" x2="359" y2="518" stroke="#dce0e5" stroke-width="2" stroke-linecap="round" /><rect x="379" y="504" width="84" height="28" rx="7" fill="url(#work-2)" stroke="#06734b" stroke-width="2"/><line x1="389" y1="510" x2="453" y2="510" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" /><rect x="390" y="524" width="5" height="3" rx="1" fill="#16191f" stroke="none" fill-opacity="0.28"/><rect x="400" y="524" width="5" height="3" rx="1" fill="#16191f" stroke="none" fill-opacity="0.28"/><rect x="410" y="524" width="5" height="3" rx="1" fill="#16191f" stroke="none" fill-opacity="0.28"/><rect x="507" y="504" width="84" height="28" rx="7" fill="url(#work-3)" stroke="#06734b" stroke-width="2"/><line x1="517" y1="510" x2="581" y2="510" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" /><rect x="518" y="524" width="5" height="3" rx="1" fill="#16191f" stroke="none" fill-opacity="0.28"/><rect x="528" y="524" width="5" height="3" rx="1" fill="#16191f" stroke="none" fill-opacity="0.28"/><rect x="538" y="524" width="5" height="3" rx="1" fill="#16191f" stroke="none" fill-opacity="0.28"/><rect x="548" y="524" width="5" height="3" rx="1" fill="#16191f" stroke="none" fill-opacity="0.28"/><text x="72" y="580" font-size="25" fill="#905600" font-weight="500" >Dismiss #1 and #2 for this de