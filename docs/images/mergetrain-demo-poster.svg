<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="svg-title svg-description"><title id="svg-title">Each branch passes. The combination fails.</title><desc id="svg-description">mergetrain by Oddfini. Illustrative workflow: four passing branches enter one shared check. The shared check identifies the failure between jobs 1 and 2. The operator excludes that pair for this demo and retains jobs 3 and 4 for exact-plan approval, default pre-push recheck, atomic push to the disposable local Git remote, and verification. Watch the 50-second demo.</desc><defs><linearGradient id="work-0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2d7f4"/><stop offset="1" stop-color="#b6a0d4"/></linearGradient><linearGradient id="work-1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dce8d7"/><stop offset="1" stop-color="#a7c1a5"/></linearGradient><linearGradient id="work-2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe4a6"/><stop offset="1" stop-color="#e6bf67"/></linearGradient><linearGradient id="work-3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d5e5ff"/><stop offset="1" stop-color="#83aceb"/></linearGradient></defs><rect width="1280" height="720" fill="#f7f7f5"/><g font-family="Arial, Helvetica, sans-serif"><text x="48" y="51" font-size="32" fill="#16191f" font-weight="700" >mergetrain</text><text x="237" y="50" font-size="23" fill="#586171" font-weight="400" >by Oddfini</text><text x="1228" y="50" font-size="25" fill="#16191f" font-weight="500" text-anchor="end">Local merge queue</text><text x="48" y="120" font-size="60" fill="#16191f" font-weight="700" >Each branch passes.</text><text x="48" y="184" font-size="60" fill="#b32640" font-weight="700" >The combination fails.</text><text x="48" y="230" font-size="27" fill="#586171" font-weight="400" >Local merge queue for parallel LLM agents</text><text x="56" y="306" font-size="23" fill="#586171" font-weight="400" >Illustrative workflow</text><rect x="600" y="291" width="245" height="177" rx="16" fill="#ffffff" stroke="#b32640" stroke-width="2"/><text x="622" y="319" font-size="23" fill="#16191f" font-weight="700" >One shared check</text><rect x="855" y="329" width="377" height="73" rx="10" fill="#fff0f2" stroke="#ebcbd1" /><line x1="357" y1="348" x2="592" y2="348" stroke="#dce0e5" stroke-width="2" stroke-linecap="round" /><line x1="852" y1="348" x2="947" y2="348" stroke="#b32640" stroke-width="2" stroke-linecap="round" /><rect x="56" y="332" width="287" height="31" rx="7" fill="#ffffff" stroke="#dce0e5" /><text x="70" y="356" font-size="23" fill="#16191f" font-weight="500" >#1 · Timeout</text><text x="327" y="356" font-size="23" fill="#06734b" font-weight="700" text-anchor="end">PASS</text><rect x="673" y="335" width="88" height="26" rx="7" fill="url(#work-0)" stroke="#b32640" stroke-width="2"/><line x1="683" y1="341" x2="751" y2="341" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" /><rect x="684" y="353" width="5" height="3" rx="1" fill="#16191f" stroke="none" fill-opacity="0.28"/><circle cx="971" cy="348" r="9" fill="#fff0f2" stroke="#b32640"/><line x1="968" y1="345" x2="974" y2="351" stroke="#b32640" stroke-width="2" stroke-linecap="round" /><line x1="974" y1="345" x2="968" y2="351" stroke="#b32640" stroke-width="2" stroke-linecap="round" /><text x="990" y="356" font-size="23" fill="#b32640" font-weight="700" >PAIR FAIL</text><line x1="357" y1="381" x2="592" y2="381" stroke="#dce0e5" stroke-width="2" stroke-linecap="round" /><line x1="852" y1="381" x2="947" y2="381" stroke="#b32640" stroke-width="2" stroke-linecap="round" /><rect x="56" y="365" width="287" height="31" rx="7" fill="#ffffff" stroke="#dce0e5" /><text x="70" y="389" font-size="23" fill="#16191f" font-weight="500" >#2 · Health</text><text x="327" y="389" font-size="23" fill="#06734b" font-weight="700" text-anchor="end">PASS</text><rect x="673" y="368" width="88" height="26" rx="7" fill="url(#work-1)" stroke="#b32640" stroke-width="2"/><line x1="683" y1="374" x2="751" y2="374" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" /><rect x="684" y="386" width="5" height="3" rx="1" fill="#16191f" stroke="none" fill-opacity="0.28"/><rect x="694" y="386" width="5" height="3" rx="1" fill="#16191f" stroke="none" fill-opacity="0.28"/><circle cx="971" cy="381" r="9" fill="#fff0f2" stroke="#b32640"/><line x1="968" y1="378" x2="974" y2="384" stroke="#b32640" stroke-width="2" stroke-linecap="round" /><line x1="974" y1="378" x2="968" y2="384" stroke="#b32640" stroke-width="2" stroke-linecap="round" /><text x="990" y="389" font-size="23" fill="#b32640" font-weight="700" >PAIR FAIL</text><line x1="357" y1="414" x2="592" y2="414" stroke="#dce0e5" stroke-width="2" stroke-linecap="round" /><line x1="852" y1="414" x2="947" y2="414" stroke="#dce0e5" stroke-width="2" stroke-linecap="round" /><rect x="56" y="398" width="287" height="31" rx="7" fill="#ffffff" stroke="#dce0e5" /><text x="70" y="422" font-size="23" fill="#16191f" font-weight="500" >#3 · Retries</text><text x="327" y="422" font-size="23" fill="#06734b" font-weight="700" text-anchor="end">PASS</text><rect x="866" y="401" width="88" height="26" rx="7" fill="url(#work-2)" stroke="#06734b" stroke-width="2"/><line x1="876" y1="407" x2="944" y2="407" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" /><rect x="877" y="419" width="5" height="3" rx="1" fill="#16191f" stroke="none" fill-opacity="0.28"/><rect x="887" y="419" width="5" height="3" rx="1" fill="#16191f" stroke="none" fill-opacity="0.28"/><rect x="897" y="419" width="5" height="3" rx="1" fill="#16191f" stroke="none" fill-opacity="0.28"/><circle cx="971" cy="414" r="9" fill="#edf7f1" stroke="#06734b"/><path d="M967,414 l3,3 l5,-6" fill="none" stroke="#06734b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="990" y="422" font-size="23" fill="#06734b" font-weight="700" >RETAINED</text><line x1="357" y1="447" x2="592" y2="447" stroke="#dce0e5" stroke-width="2" stroke-linecap="round" /><line x1="852" y1="447" x2="947" y2="447" stroke="#dce0e5" stroke-width="2" stroke-linecap="round" /><rect x="56" y="431" width="287" height="31" rx="7" fill="#ffffff" stroke="#dce0e5" /><text x="70" y="455" font-size="23" fill="#16191f" font-weight="500" >#4 · Logging</text><text x="327" y="455" font-size="23" fill="#06734b" font-weight="700" text-anchor="end">PASS</text><rect x="866" y="434" width="88" height="26" rx="7" fill="url(#work-3)" stroke="#06734b" stroke-width="2"/><line x1="876" y1="440" x2="944" y2="440" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" /><rect x="877" y="452" width="5" height="3" rx="1" fill="#16191f" stroke="none" fill-opacity="0.28"/><rect x="887" y="452" width="5" height="3" rx="1" fill="#16191f" stroke="none" fill-opacity="0.28"/><rect x="897" y="452" width="5" height="3" rx="1" fill="#16191f" stroke="none" fill-opacity="0.28"/><rect x="907" y="452" width="5" height="3" rx="1" fill="#16191f" stroke="none" fill-opacity="0.28"/><circle cx="971" cy="447" r="9" fill="#edf7f1" stroke="#06734b"/><path d="M967,447 l3,3 l5,-6" fill="none" stroke="#06734b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="990" y="455" font-size="23" fill="#06734b" font-weight="700" >RETAINED</text><path d="M827,241 V230 H860 V296 H827" fill="none" stroke="#b32640" stroke-width="2" transform="translate(0 96)"/><text x="56" y="511" font-size="27" fill="#905600" font-weight="700" >The operator excludes #1 + #2 for this demo.</text><text x="56" y="547" font-size="25" fill="#16191f" font-weight="400" >The retained pair is approved, rechecked, pushed and verified.</text><rect x="48" y="570" width="1184" height="62" rx="12" fill="#ffffff" stroke="#dce0e5" /><text x="72" y="610" font-size="28" fill="#005de8" font-weight="700" >Watch the 50-second demo</text><text x="1208" y="609" font-size="26" fill="#16191f" font-weight="500" text-anchor="end">Try it locally · uvx mergetrain demo</text><line x1="48" y1="650" x2="1232" y2="650" stroke="#dce0e5" stroke-width="2" stroke-linecap="round" /><text x="48" y="682" font-size="23" fill="#586171" font-weight="400" >Recorded CLI results · disposable local Git remote · mergetrain 3.5.0</text><text x="1232" y="682" font-size="23" fill="#586171" font-weight="400" text-anchor="end">50-second demo</text></g></svg>